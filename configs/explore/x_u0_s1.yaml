# S9 exploratory config `x_u0_s1` (explore/s9-opt branch; NOT part of the approved v1).
# Wave 1 calibration: U0 with training seed 1 (D1-10 optional "seeds {1, 2}").
# Identical to configs/threetower_u0.yaml except `exp`, `run_root` and the key marked
# "S9 CHANGED" (enforced by tests/test_explore_configs.py). Selection = D1-8 (val masked mean R@20).
# Server: sbatch -J x_u0_s1 scripts/explore/train_explore.sbatch configs/explore/x_u0_s1.yaml <EXPLORE_SHA>
exp: x_u0_s1
processed_dir: data/processed
run_root: /local-scratch/liang/runs_explore   # S9 explore root (sbatch also passes --out_dir); never the formal runs/
condition: normal
user_features: u0
device: cuda
require_clean_git: true               # D1-11: refuse to run on a dirty worktree
history: {}                           # D1-2 defaults: max_len 100, D = 20 min, recency clip 13
model: {}                             # D1-1 defaults: base 128, heads 64, 2-layer Transformer, id_dropout 0.1
train:                                # D1-3
  tau: 0.05
  lr: 1.0e-3
  warmup_steps: 300
  weight_decay: 0.01
  clip_grad_norm: 1.0
  batch_size: 1024                    # initial value; OPEN until the GPU benchmark confirms it
  max_epochs: 30
  patience: 3
  like_oversample: 1                  # v1; k = 4 only as a D1-10 targeted adjustment
  seed: 1                           # S9 CHANGED (only change vs threetower_u0.yaml)
  max_steps: null
  log_every: 50
eval:
  threads: 1                          # CPU threads for canonical export / parity (recorded in manifest)
  val_user_batch_size: 256            # validation encoding batch (selection only; on the training device)
  chunk: 2048
  parity_users: 2048

# S9 exploratory run registry (explore/s9-opt). Every run is registered here BEFORE its GPU job.
# Post-hoc exploratory study: designed after the formal v1 test results were analysed.
# Selection protocol for every run: PLAN.md D1-8 unchanged (normal val masked frames at T_val,
# mean R@20 over 4 tasks, N@20 tie-break, earliest wins exact ties, patience 3, <= 30 epochs).
# Test metrics are computed by the unchanged runner but are SEALED: explore summaries read only
# val per-user files, selection.json and train_log.jsonl.
#
# Run kinds (enforced by tests/test_explore_configs.py):
#   seed_calibration       U0 with only train.seed changed (vs threetower_u0.yaml).
#   d1_10_*                hyperparameter variant: exactly one D1-10 knob changed vs threetower_u0.yaml.
#   seed_replicate         an approved variant (`base`) with only train.seed changed vs that variant.
#   reproduction_control   no training/model key changed vs threetower_u0.yaml (only exp / run_root).
#
# D1-10 budget: "<= 7 extra configs in total", one change at a time, chosen on val only.
# Counted = hyperparameter variants (d1_10: true). Seed replicates, seed calibrations and the
# reproduction control are not new configurations (D1-10 "optional seeds {1, 2}") and are not counted.
# The formal v1 used 0 of the 7 (no targeted adjustment was run; PROGRESS.md, Track A).
d1_10_budget: 7
runs:
  # Wave 1 (jobs 39-43, completed; all rc 0, parity PASS)
  x_u0_s1:    {wave: 1, status: completed, job: 39, kind: seed_calibration, d1_10: false, change: {train.seed: 1}}
  x_u0_s2:    {wave: 1, status: completed, job: 40, kind: seed_calibration, d1_10: false, change: {train.seed: 2}}
  x_lr5e4:    {wave: 1, status: completed, job: 41, kind: d1_10_lr,  d1_10: true, change: {train.lr: 5.0e-4}}
  x_tau003:   {wave: 1, status: completed, job: 42, kind: d1_10_tau, d1_10: true, change: {train.tau: 0.03}}
  x_tau010:   {wave: 1, status: completed, job: 43, kind: d1_10_tau, d1_10: true, change: {train.tau: 0.1}}
  # Wave 2 (approved 2026-10-12 19:55 PT): same-SHA U0 control + seed replicates of x_lr5e4
  x_u0_repro: {wave: 2, status: approved, kind: reproduction_control, d1_10: false, change: {}}
  x_lr5e4_s1: {wave: 2, status: approved, kind: seed_replicate, base: x_lr5e4, d1_10: false, change: {train.seed: 1}}
  x_lr5e4_s2: {wave: 2, status: approved, kind: seed_replicate, base: x_lr5e4, d1_10: false, change: {train.seed: 2}}
  # Not created (separate approval): x_musicgate (E2 gated music fusion, gate_init 1.0; code change).

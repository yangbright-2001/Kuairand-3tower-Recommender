[project]
name = "kuairand-rec"
version = "0.1.0"
description = "Multi-action three-tower retrieval (video + music) on KuaiRand-Pure"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "pyyaml>=6",
    "torch>=2.4",
    "implicit>=0.7.2",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kuairand_rec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
